---
# overrides for grafana.grafana.alloy, see:
# https://github.com/grafana/grafana-ansible-collection/blob/main/roles/alloy/defaults/main.yml

# https://grafana.com/docs/alloy/latest/reference/components/loki/loki.source.journal/
alloy_config: |
  loki.write "default" {
    endpoint {
      url = "http://{{ vault_alloy_loki_endpoint | default('127.0.0.1:3100', true) }}/loki/api/v1/push"
    }
  }

  loki.relabel "journal" {
    forward_to = []

    rule {
      source_labels = ["__journal__systemd_unit"]
      regex         = "(grafana|loki).service"
      action        = "drop"
    }

    rule {
      source_labels = ["__journal__systemd_unit"]
      target_label  = "unit"
    }

    rule {
      source_labels = ["__journal__hostname"]
      target_label  = "hostname"
    }

    rule {
      source_labels = ["__journal__hostname"]
      target_label  = "instance"
    }

    rule {
      source_labels = ["__journal__hostname"]
      target_label  = "service"
    }

    rule {
      source_labels = ["__journal_priority_keyword"]
      target_label  = "level"
    }

    rule {
      source_labels = ["__journal_syslog_identifier"]
      target_label  = "syslog_identifier"
    }
  }

  loki.source.journal "read"  {
    forward_to    = [loki.write.default.receiver]
    relabel_rules = loki.relabel.journal.rules
    labels        = {
      component = "loki.source.journal",
      exporter  = "alloy",
    }
  }
